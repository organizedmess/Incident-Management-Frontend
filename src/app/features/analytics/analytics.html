<div class="page">
  <div class="page-header">
    <div>
      <h1>Analytics</h1>
      <p class="page-subtitle">Deeper insight into incident volume, severity mix and resolution performance.</p>
    </div>
  </div>

  @if (usingDemoData() && connectionState() !== 'connected') {
    <app-connection-status class="page-banner" />
  }

  @if (error()) {
    <app-error-state
      title="Couldn't load analytics"
      message="We couldn't reach the incident API. Check that the backend is running and try again."
      (retry)="retry()"
    />
  } @else {
    <section class="kpi-row">
      <app-kpi-tile label="Total incidents" icon="inbox" tone="default" [value]="overview()?.totalIncidents ?? 0" />
      <app-kpi-tile label="Resolution rate" icon="circle-check" tone="good" [value]="resolutionRate() + '%'" />
      <app-kpi-tile label="Avg. AI priority score" icon="brain-circuit" tone="info" [value]="(overview()?.averagePriorityScore ?? 0).toFixed(1)" hint="out of 100" />
      <app-kpi-tile label="Critical incidents" icon="shield-alert" tone="critical" [value]="overview()?.criticalIncidents ?? 0" />
    </section>

    <app-card title="Incidents over time" subtitle="Daily incident volume, last 30 days">
      <app-trend-chart [data]="trendChartData()" />
    </app-card>

    <section class="charts-row">
      <app-card title="Severity mix" subtitle="Share of incidents by severity">
        <app-bar-list [data]="severityBarData()" />
      </app-card>

      <app-card title="Status breakdown" subtitle="Where incidents currently stand">
        <app-donut-chart [data]="statusDonutData()" centerLabel="Total" />
      </app-card>
    </section>
  }
</div>
